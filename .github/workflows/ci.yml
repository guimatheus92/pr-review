name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        # win32 has dedicated spawn handling (copilot.cmd shim) — test both.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test
      - name: Bundle freshness — dist/cli.cjs must match src/
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code dist/cli.cjs || (echo '::error::dist/cli.cjs is stale — run `npm run build` and commit the bundle' && exit 1)
      # The mods API is marked early access, so the CLI is pinned to the version the kit tests
      # were validated against and bumped on purpose; the step runs last so a CLI failure never
      # hides the freshness check above.
      - name: Live mod — validate and test with the Claude Code CLI (offline; no credential)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        env:
          DISABLE_AUTOUPDATER: '1'
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.291
          claude --version
          npm run validate:mod
          npm run test:mod
