# .pr-review.yaml — per-repo config (committed; the team shares it)
# Copy to .pr-review.yaml at the repo root. All keys are optional.
# Precedence: CLI flags > env vars > this file > ~/.pr-review/config.yaml > defaults
# (env vars override yaml).

# Which agent CLI hosts the review session (also --runtime flag, PR_REVIEW_RUNTIME env var).
#   auto    — probe PATH: copilot first, then claude; error if neither found (default)
#   copilot — Copilot CLI
#   claude  — Claude Code
# runtime: auto

# Default model for the review session.
# The copilot-style default claude-opus-4.8 is mapped to `opus` for the claude
# runtime; models you specify here pass through as-is.
# default_model: claude-opus-4.8

# Language for finding titles/bodies (also --lang flag, PR_REVIEW_LANG env var).
# language: en
# language: pt-BR

# Disable auto-discovery of the standard skill dirs for this repo
# (.claude/.copilot/.github/.agents under skills/, repo + home).
# autodiscover: false

# Skill packs — git repos that supply the review passes, cloned to
# ~/.pr-review/packs/<name>/ (`pr-review packs list` shows the resolved set,
# `pr-review packs sync` clones/pulls them all).
# ⚠ REPLACE semantics: unlike every other list key (which pushes across config
# levels), a `skill_packs:` here overrides the global list AND the built-in
# defaults entirely. `skill_packs: []` disables packs altogether.
# skill_packs:
#   - github/awesome-copilot            # 'owner/repo' shorthand — name inferred,
#                                       # include defaults to "**/SKILL.md"
#   - git: OWASP/CheatSheetSeries       # full form ('owner/repo' or a git URL)
#     name: owasp                       # dir under ~/.pr-review/packs/ + pass-name prefix
#     ref: master                       # branch/tag to pin (default: repo's default branch)
#     include: ["cheatsheets/*.md"]     # globs (pack-relative) selecting skill files
#     exclude: ["*deprecated*"]         # globs vs pack-relative path AND skill name
#     mode: auto                        # auto — skills can run as passes;
#                                       # index — on-demand skills index only, never a pass
#     baseline: [error-handling, logging]  # skills that run as a pass on EVERY PR

# Extra directories to load skills from (paths relative to this file). They are
# selected like repo skill dirs — applies_to/applyTo/paths targeting and the
# relevance heuristic apply, unmatched files land in the on-demand index — and
# trust-checked: a file the PR under review changed is skipped. Nothing here
# forces a skill; to inject a directory whole into every pass, use
# --force-skill <dir> on the CLI, per run.
# Note: standalone reviewers are NEVER dispatched — every review pass is a
# generic agent applying one skill. The extra_reviewers* keys still parse but
# are ignored on the review path; use the extra_skills* keys.
# extra_reviewers_dirs:
#   - ./docs/code-review
# extra_skills_dirs:
#   - ./docs/conventions

# Single files to include.
# extra_reviewers:
#   - ./SECURITY-CHECKLIST.md
# extra_skills:
#   - ./ARCHITECTURE.md

# Packaged plugins (have their own plugin.yaml).
# plugins:
#   - dir: ./.pr-review/plugins/csharp
#   - name: "@myorg/pr-review-plugin-azure-best-practices"

# Dedupe mode for findings vs existing comments.
#   strict — drop more aggressively (default)
#   loose  — drop only near-exact matches
#   off    — keep everything
# dedupe:
#   mode: strict

# Pass names to always skip in this repo — full (awesome-copilot/go) or bare
# suffix (go); `verifier` and `codex` also work. (Also --skip flag.)
# skip_reviewers:
#   - awesome-copilot/self-explanatory-code-commenting
#   - logging

# Suppress the companion-plugin warning in this repo.
# companion_warn: false

# Invoke installed companion plugins (pr-review-toolkit agents, code-review) as
# extra reviewers. ON by default when the companion is installed; roughly 2-3x
# review cost. Set false to opt out (also --no-companions per run).
# invoke_companions: false

# Codex second-opinion reviewer. Runs automatically (as a sibling process, in
# parallel with the review session) when the `codex` CLI is installed; silently
# skipped otherwise. Set to false to opt out (also --no-codex flag,
# PR_REVIEW_NO_CODEX=1 env var, or --skip codex).
# invoke_codex: false

# Extra patterns to exclude from the diff (in addition to defaults like lockfiles, vendor, etc.).
# diff_excludes:
#   - "**/*.snap"
#   - "**/legacy/**"
