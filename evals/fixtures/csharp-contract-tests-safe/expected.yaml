must_not_find:
  - "(?=.*authoriz)(?=.*(?:policy|schemes?))(?=.*(?:test|assert))(?=.*(?:only checks|not assert|missing|exact expected|exact value))"
  - "(?=.*(?:route.?filter|filter))(?=.*(?:argument|parameter))(?=.*(?:deriv|comput|circular))(?=.*(?:expected|oracle|implementation|current))"
must_dispatch:
  - csharp-mstest
  - dotnet-best-practices
must_not_dispatch:
  - azure-functions-csharp
  - azure-durable-functions-csharp
  - csharp-mcp-server
  - github-copilot-sdk-c#
stack:
  include: ["c#"]
  exclude: [smalltalk, cake, cakescript, rss, wsdl, xsd]
dependencies:
  include: [mstest.testframework, mstest.testadapter]
